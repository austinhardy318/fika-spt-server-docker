name: Tag on Version Update PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - master
  workflow_dispatch:

jobs:
  update-tag:
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.merged == true && (
          contains(github.event.pull_request.labels.*.name, 'fika-update') ||
          contains(github.event.pull_request.labels.*.name, 'spt-update')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable release tag
        id: tag
        run: |
          SPT_VERSION=$(grep "^ARG SPT_VERSION=" Dockerfile | head -n1 | cut -d'=' -f2 | cut -d'-' -f1)
          FIKA_VERSION=$(grep "^ARG FIKA_VERSION=" Dockerfile | head -n1 | cut -d'=' -f2)
          BASE="${SPT_VERSION}-fika${FIKA_VERSION}"

          # Next docker revision for this SPT+Fika pair (packaging-only bumps use the same base)
          N=1
          while git rev-parse "refs/tags/${BASE}.${N}" >/dev/null 2>&1; do
            N=$((N + 1))
          done
          TAG="${BASE}.${N}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${TAG}" HEAD -m "SPT ${SPT_VERSION} with Fika ${FIKA_VERSION} (docker rev ${N})"
          git push origin "${TAG}"

          echo "Created immutable tag ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN tag pushes do not trigger on.push workflows — call publish directly.
  publish:
    needs: update-tag
    if: needs.update-tag.outputs.tag != ''
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.update-tag.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  create-release:
    needs: [update-tag, publish]
    if: needs.update-tag.outputs.tag != ''
    uses: ./.github/workflows/create-release.yml
    with:
      tag: ${{ needs.update-tag.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
